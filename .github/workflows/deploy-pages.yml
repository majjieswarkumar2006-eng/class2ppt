name: Deploy static site to main root

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-main-root
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static HTML/JS/CSS
        run: npm run build

      - name: Publish build output to repository root
        run: |
          cp dist/index.html index.html
          rm -rf assets
          cp -r dist/assets assets
          if [ -f dist/favicon.svg ]; then cp dist/favicon.svg favicon.svg; fi

      - name: Commit and push static site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html assets favicon.svg
          git diff --staged --quiet && echo "No changes to deploy" && exit 0
          git commit -m "deploy: static site to main root [skip ci]"
          git push
